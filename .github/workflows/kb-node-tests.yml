# KB UI pipeline

name: KB UI pipeline

on: push

jobs:
  build-node-versions:
    name: Node version matrix
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - name: Checkout the code
        uses: actions/checkout@v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
        env:
          NPM_CONFIG_IGNORE_SCRIPTS: true
      - run: npm audit --package-lock-only --production --audit-level=critical
      - run: npm ci --ignore-scripts --min-release-age=7
      - run: npm run lint
      - run: npm run build --if-present

  license-scan:
    name: License compliance check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: mikaelvesavuori/license-compliance-action@main
        with:
          # important note: GPL-2.0-or-later is compatible with GPLv3 per gnu.or: https://www.gnu.org/licenses/gpl-faq.html#v2v3Compatibility
          # as of now, this component is licensed with GPLv3
          allow_licenses: MIT;ISC;0BSD;BSD-2-Clause;BSD-3-Clause;Apache-2.0;BlueOak-1.0.0;GPL-2.0-or-later
          exclude_pattern: /^@natlibfi/;nodemailer
          # nodemailer@9.1.1 and the current version are both licensed under MIT No Attribution license: https://github.com/nodemailer/nodemailer/tree/v9.1.1#license

  njsscan:
    name: Njsscan check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the code
        uses: actions/checkout@v7
      - name: nodejsscan scan
        id: njsscan
        uses: ajinabraham/njsscan-action@master
        with:
          args: "."

  openshift-webhook:
    name: OpenShift webhook for image builder
    needs: [build-node-versions, njsscan]
    runs-on: ubuntu-latest

    steps:
      - name: Staging webhook
        uses: joelwmale/webhook-action@master
        if: github.ref == 'refs/heads/test'
        with:
          url: ${{ secrets.WEBHOOK_URL_TEST }}
          body: "{}"
      - name: Production webhook
        uses: joelwmale/webhook-action@master
        if: github.ref == 'refs/heads/main'
        with:
          url: ${{ secrets.WEBHOOK_URL_PROD }}
          body: "{}"
